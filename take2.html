<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta property="og:title" content="Take Two: Murder at Valmont Manor"><meta property="og:description" content="Same night, a different killer. Adriana’s 18th birthday at La Nena."><meta property="og:image" content="https://ginabonnelly-cpu.github.io/valmont/gus.jpg"><meta property="og:type" content="website"><title>Valmont Case Files: Take Two</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600;1,9..144,800&family=Josefin+Sans:wght@400;600;700&family=Special+Elite&display=swap">
<style>
/* Layout: one narrow phone column per file (character, zone, evidence), a hero image on top, a tall stack of labelled panels below. Single dark "1977 backstage" look. */
:root{
  --ground:#1A0F09; --panel:#2A1810; --panel-2:#3A2216; --ink:#F2E3C6; --ink-soft:#C9B28E;
  --mustard:#D9A53A; --rust:#C4581F; --wine:#9A3522; --line:#4A2E1E; --paper:#EFE2C4; --paper-ink:#2A1A10;
  --display:"Fraunces",Georgia,"Times New Roman",serif; --body:"Josefin Sans","Avenir Next","Segoe UI",sans-serif;
  --type:"Special Elite","Courier New",monospace; --hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;justify-content:space-between;gap:10px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--mustard);font-weight:600;padding-top:16px}
.bar span:last-child{color:var(--ink-soft)}
.hero{position:relative;border-radius:14px;overflow:hidden;background:var(--panel);max-width:100%}
.hero img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}
.hero.sq img{aspect-ratio:1/1}
.hero .cap{position:absolute;inset:auto 0 0 0;padding:70px 18px 16px;background:linear-gradient(transparent,rgba(20,10,5,.92))}
h1{font-family:var(--display);font-style:italic;font-weight:800;font-size:clamp(30px,8.5vw,42px);line-height:1.02;margin:0;text-wrap:balance}
.role{font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--mustard);font-weight:700;margin-top:6px}
.item{background:var(--mustard);color:#24150B;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.item b{font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.lab{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--rust);font-weight:700}
.panel p{margin:0}
.rounds{display:grid;gap:10px}
.rnd{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rnd .no{font-family:var(--display);font-style:italic;font-weight:800;font-size:30px;color:var(--mustard);line-height:1}
.rnd .verb{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--rust);font-weight:700}
.rnd p{margin:2px 0 0;min-width:0}
.secret{position:relative}
.secret .txt{filter:blur(7px);transition:filter .25s;user-select:none}
.secret.open .txt{filter:none;user-select:auto}
button{font:inherit;cursor:pointer}
.reveal{align-self:flex-start;background:transparent;color:var(--mustard);border:1px solid var(--mustard);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;letter-spacing:.05em}
.reveal:focus-visible,.btn:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--mustard);outline-offset:2px}
.killer{background:var(--wine);border-radius:12px;padding:14px 16px;font-family:var(--display);font-style:italic;font-weight:800;font-size:24px;line-height:1.1}
.killer small{display:block;font-family:var(--body);font-style:normal;font-weight:600;font-size:13px;letter-spacing:.04em;margin-top:6px;color:#F7D9C6}
.note{font-size:13px;color:var(--ink-soft);text-align:center}
.kicker{font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--rust);font-weight:700}
.where{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.where b{color:var(--mustard)}
/* paper documents */
.doc{background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:22px 20px;box-shadow:0 14px 30px rgba(0,0,0,.45);transform:rotate(-1.2deg);margin:6px 4px}
.doc .head{font-family:var(--type);font-size:13px;letter-spacing:.12em;text-transform:uppercase;border-bottom:1.5px solid var(--paper-ink);padding-bottom:6px;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px}
.doc .body{font-family:var(--type);font-size:15px;line-height:1.6}
.doc.hand .body{font-family:var(--hand);font-size:24px;line-height:1.3;font-weight:500}
.doc.burnt{background:radial-gradient(circle at 0 0,#2a160b 0 22px,transparent 52px),radial-gradient(circle at 100% 100%,#2a160b 0 30px,transparent 70px),radial-gradient(circle at 100% 0,#5a3018 0 16px,transparent 44px),linear-gradient(#e9d5a8,#d9bd86);transform:rotate(1.4deg)}
.doc .stamp{display:inline-block;margin-top:14px;border:2px solid var(--wine);color:var(--wine);font-family:var(--type);font-size:12px;letter-spacing:.12em;padding:3px 8px;transform:rotate(-5deg)}
/* accusation */
.acc{display:flex;flex-direction:column;gap:10px}
.acc label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
.acc select,.acc textarea{width:100%;background:var(--ground);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;font-size:16px}
.btn{background:var(--rust);color:#FFF4E2;border:0;border-radius:999px;padding:12px 18px;font-weight:700;letter-spacing:.05em;min-height:44px}
.btn.wa{display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;background:#1F8A4C;color:#fff;margin-top:4px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-soft)}
.sealed{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:16px;font-family:var(--type);display:grid;gap:6px}
.sealed div span{display:block;font-size:11px;letter-spacing:.14em;opacity:.7}
/* host */
.host h2{font-family:var(--display);font-style:italic;font-weight:800;font-size:24px;margin:18px 0 0}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mustard);background:var(--panel)}
td{font-variant-numeric:tabular-nums}
.say{font-family:var(--display);font-style:italic;font-size:17px;line-height:1.5}
.linkbtn{background:none;border:0;color:var(--mustard);text-decoration:underline;padding:0;font-size:14px;font-weight:600}
.back{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;align-self:flex-start;margin-top:12px;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600}
.landing{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:center}
.landing h1{font-size:clamp(36px,11vw,56px)}
.script{font-family:var(--hand);font-size:44px;color:var(--mustard);line-height:1}
.intro{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding-top:8px}
.intro h1{font-size:clamp(34px,10vw,52px)}
.when{margin:4px 0 0;font-size:13px;letter-spacing:.08em;color:var(--ink-soft)}
.story,.how{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.story p,.how p{margin:0}
.how{border-color:var(--mustard)}
.victim{position:relative;border-radius:10px;overflow:hidden;margin-bottom:4px}
.victim img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:top}
.victim .vc{position:absolute;inset:auto 0 0 0;padding:60px 14px 12px;background:linear-gradient(transparent,rgba(20,10,5,.92))}
.victim .cn{font-family:var(--display);font-style:italic;font-weight:800;font-size:30px;line-height:1.05}
.casth{font-family:var(--display);font-style:italic;font-weight:800;font-size:28px;margin:10px 0 0}
.cast{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.castc{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.castc img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}
.castc .cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.castc .cn{font-family:var(--display);font-style:italic;font-weight:800;font-size:18px;line-height:1.1}
.castc .role{margin-top:0;font-size:10px}
.castc p{margin:2px 0 0;font-size:13px;line-height:1.4;color:var(--ink-soft);flex:1}
.tag{align-self:flex-start;margin-top:6px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;border-radius:999px;padding:4px 8px;white-space:nowrap;background:var(--mustard);color:#24150B}
.tag.open{background:transparent;color:var(--mustard);border:1px solid var(--mustard)}
.castc.star{grid-column:1/-1;flex-direction:row}
.castc.star img{width:44%;flex:none}
@media (min-width:640px){.cast{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){.secret .txt{transition:none}}
</style>
